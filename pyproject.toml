[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = '(^\.venv/|^\.cache/|^docs/)'

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: boots real services; excluded from the commit gate",
    "eval: runs DeepEval metrics against live models; costs money, not deterministic",
]
