name: gate

on:
  # `push:` is scoped to `main` only. A feature-branch commit that fires
  # both `push` and `pull_request` for the same SHA gets its context
  # disambiguated by GitHub into "gate / offline gate (push)" and
  # "... (pull_request)" -- neither of which matches the bare
  # "gate / offline gate" that branch protection requires, so the check
  # hangs as permanently pending. Scoping push to `main` means a branch
  # commit fires only `pull_request` (one context, unsuffixed, matches),
  # and a merge to `main` fires only `push` (same). Found live on the
  # stage-1 PR, 2026-08-22.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: black --check . tests/*.py
      - run: flake8 .
      - run: mypy .
      # No network, no API keys, no live services. This is the whole of what
      # CI can honestly guarantee about this project.
      - run: pytest -q -m "not smoke and not eval"

  evals:
    name: deepeval (manual only)
    # Never on push. The eval tier spends real money and is not
    # deterministic; a red result from judge drift would train everyone to
    # ignore a red CI, and then CI stops catching real breakage.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: deepeval test run tests/
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_MODEL_NAME: ${{ secrets.JUDGE_MODEL_NAME }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
