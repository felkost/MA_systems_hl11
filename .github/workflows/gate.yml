name: gate

on:
  # `push:` is scoped to `main` so a feature-branch commit does not run this
  # identical gate twice on one SHA (once for `push`, once for
  # `pull_request`). Branch protection matches the bare job name
  # (`offline gate`) -- the "gate / " prefix and "(push)"/"(pull_request)"
  # suffixes are UI decoration, not part of the matched context.
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: black --check . tests/*.py
      - run: flake8 .
      - run: mypy .
      # No network, no API keys, no live services. This is the whole of what
      # CI can honestly guarantee about this project.
      - run: pytest -q -m "not smoke and not eval"

  # A `deepeval test run tests/` CI job (manual-dispatch only) previously
  # lived here. Removed, author's own decision: the
  # eval tier's real work happens as a deliberate, cost-announced, manually
  # orchestrated live measurement each stage (this project's own session
  # protocol), never through CI regardless of trigger -- the dispatch-only
  # job was never once invoked and added a permanently-"skipped" check to
  # every PR for no benefit. `deepeval test run tests/` remains the
  # deliverable command; it is simply run by a person, not by a workflow.
