<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="s9d-title s9d-desc">
    <title id="s9d-title">Sequence comparison: stage 9c's stalled run versus stage 9d's nudged recovery, after an identical save_report refusal</title>
    <desc id="s9d-desc">Both stages reach the same point: critique returns REVISE with revision rounds remaining, the Supervisor calls save_report, and SaveReportVerdictGuardMiddleware refuses it because the verdict is not APPROVE and rounds remain. In stage 9c, nothing pushes the model further; it ends its turn with a chat message, and no report file is ever written. In stage 9d, SaveReportGuardMiddleware's new nudge fires, re-prompting the model to call critique again; the model does so, then calls save_report a second time, which now succeeds, writing a real report file to disk.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <text x="30" y="26" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.10em">SAME STARTING POINT — critique returns REVISE, rounds remain</text>

    <g font-family="Arial,sans-serif" text-anchor="middle">
      <rect x="330" y="40" width="240" height="34" rx="6" fill="rgba(76,82,109,0.06)" stroke="#4c526d" stroke-width="1"/>
      <text x="450" y="62" fill="#2d3142" font-size="11" font-weight="bold">save_report called</text>
    </g>
    <line x1="450" y1="74" x2="450" y2="96" stroke="#4c526d" stroke-width="1.2" marker-end="url(#s9d-arrow)"/>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <rect x="290" y="96" width="320" height="40" rx="6" fill="rgba(241,132,138,0.14)" stroke="#c0525a" stroke-width="1.2"/>
      <text x="450" y="113" fill="#2d3142" font-size="10.5" font-weight="bold">SaveReportVerdictGuardMiddleware</text>
      <text x="450" y="128" fill="#8a3b41" font-size="9.5">refuses -- verdict != APPROVE, rounds remain</text>
    </g>

    <line x1="450" y1="136" x2="250" y2="168" stroke="#4c526d" stroke-width="1.1" marker-end="url(#s9d-arrow)"/>
    <line x1="450" y1="136" x2="650" y2="168" stroke="#4c526d" stroke-width="1.1" marker-end="url(#s9d-arrow)"/>
    <text x="330" y="158" fill="#6f7690" font-size="10" font-family="Arial,sans-serif">stage 9c</text>
    <text x="580" y="158" fill="#6f7690" font-size="10" font-family="Arial,sans-serif">stage 9d</text>

    
    <g>
      <rect x="90" y="172" width="320" height="34" rx="6" fill="rgba(76,82,109,0.03)" stroke="#4c526d" stroke-width="0.9"/>
      <text x="250" y="193" fill="#2d3142" font-size="10.5" text-anchor="middle" font-family="Arial,sans-serif">SaveReportGuardMiddleware: no nudge</text>
      <text x="250" y="222" fill="#6f7690" font-size="9.5" text-anchor="middle" font-family="Arial,sans-serif">nudge fired only on APPROVE-unsaved</text>
      <line x1="250" y1="206" x2="250" y2="242" stroke="#c0525a" stroke-width="1.1" marker-end="url(#s9d-arrow-red)"/>
      <rect x="90" y="242" width="320" height="46" rx="6" fill="rgba(241,132,138,0.10)" stroke="#c0525a" stroke-width="1.2"/>
      <text x="250" y="262" fill="#2d3142" font-size="10.5" text-anchor="middle" font-weight="bold" font-family="Arial,sans-serif">model ends turn with prose</text>
      <text x="250" y="278" fill="#8a3b41" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">"Would you like me to proceed..."</text>
      <line x1="250" y1="288" x2="250" y2="318" stroke="#c0525a" stroke-width="1.1" marker-end="url(#s9d-arrow-red)"/>
      <rect x="90" y="318" width="320" height="46" rx="6" fill="none" stroke="#c0525a" stroke-width="1.4" stroke-dasharray="5,3"/>
      <text x="250" y="340" fill="#8a3b41" font-size="10.5" text-anchor="middle" font-weight="bold" font-family="Arial,sans-serif">no report file written</text>
      <text x="250" y="356" fill="#8a3b41" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">output dir empty -- measured, this stage's own run</text>
    </g>

    
    <g>
      <rect x="490" y="172" width="320" height="34" rx="6" fill="rgba(203,208,164,0.20)" stroke="#5c6a2e" stroke-width="0.9"/>
      <text x="650" y="193" fill="#2d3142" font-size="10.5" text-anchor="middle" font-weight="bold" font-family="Arial,sans-serif">SaveReportGuardMiddleware: REVISE nudge fires</text>
      <line x1="650" y1="206" x2="650" y2="228" stroke="#5c6a2e" stroke-width="1.1" marker-end="url(#s9d-arrow-green)"/>
      <text x="650" y="222" fill="#5c6a2e" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">"rounds remain -- call critique again"</text>
      <rect x="490" y="228" width="320" height="34" rx="6" fill="rgba(203,208,164,0.10)" stroke="#5c6a2e" stroke-width="0.9"/>
      <text x="650" y="249" fill="#2d3142" font-size="10.5" text-anchor="middle" font-family="Arial,sans-serif">model calls critique, then save_report again</text>
      <line x1="650" y1="262" x2="650" y2="288" stroke="#5c6a2e" stroke-width="1.1" marker-end="url(#s9d-arrow-green)"/>
      <rect x="490" y="288" width="320" height="34" rx="6" fill="rgba(203,208,164,0.28)" stroke="#5c6a2e" stroke-width="1.2"/>
      <text x="650" y="309" fill="#2d3142" font-size="10.5" text-anchor="middle" font-weight="bold" font-family="Arial,sans-serif">save_report span: status=OK</text>
      <line x1="650" y1="322" x2="650" y2="342" stroke="#5c6a2e" stroke-width="1.1" marker-end="url(#s9d-arrow-green)"/>
      <rect x="490" y="342" width="320" height="46" rx="6" fill="none" stroke="#5c6a2e" stroke-width="1.4"/>
      <text x="650" y="364" fill="#3f4a1f" font-size="10.5" text-anchor="middle" font-weight="bold" font-family="Arial,sans-serif">report file on disk</text>
      <text x="650" y="380" fill="#3f4a1f" font-size="9" text-anchor="middle" font-family="Arial,sans-serif">7174 / 3328 bytes -- measured, this stage's own run</text>
    </g>

    <defs>
      <marker id="s9d-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#4c526d"/>
      </marker>
      <marker id="s9d-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#c0525a"/>
      </marker>
      <marker id="s9d-arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#5c6a2e"/>
      </marker>
    </defs>
  </svg>
