<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="s9c-title s9c-desc">
    <title id="s9c-title">Stage 9c re-measurement: pass/fail per case, r1 versus r2, grouped by target/regression/recovered/unchanged</title>
    <desc id="s9c-desc">Fourteen golden-dataset cases compared between the r1 Researcher prompt (stage 9a baseline) and the r2 fix (stage 9c). Two cases were the fix's own target and show no improvement, both still failing Correctness. Three unrelated cases regressed from passing to failing. Two unrelated cases newly passed. Seven cases show no status change either way. Overall pass count moved from 6 of 14 to 5 of 14.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <text x="30" y="26" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.10em">OVERALL TEST STATUS PER CASE — deepeval test run tests/test_e2e.py</text>

    <g font-family="Arial,sans-serif" text-anchor="middle">
      <text x="580" y="50" fill="#6f7690" font-size="10" font-weight="600">r1</text>
      <text x="580" y="62" fill="#9296a8" font-size="8">stage 9a</text>
      <text x="650" y="50" fill="#6f7690" font-size="10" font-weight="600">r2</text>
      <text x="650" y="62" fill="#9296a8" font-size="8">stage 9c</text>
    </g>
    <text x="675" y="50" fill="#6f7690" font-size="10" font-weight="600" font-family="Arial,sans-serif">Δ Correctness</text>

    
