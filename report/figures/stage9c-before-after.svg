    <text x="36" y="106" fill="#2d3142" font-size="9.5" font-family="Consolas,monospace">edge-narrow-memory-question</text>
    <circle cx="580" cy="102" r="6" fill="none" stroke="#c0525a" stroke-width="2"/>
    <circle cx="650" cy="102" r="6" fill="none" stroke="#c0525a" stroke-width="2"/>
    <text x="675" y="106" fill="#6f7690" font-size="9" font-family="Arial,sans-serif">0.0 → 0.0 — unchanged, still fabricates</text>

    <rect x="24" y="116" width="796" height="24" rx="4" fill="rgba(244,210,112,0.10)" stroke="#c9a227" stroke-width="0.8"/>
