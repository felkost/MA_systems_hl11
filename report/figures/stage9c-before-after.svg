    <text x="675" y="300" fill="#6f7690" font-size="9" font-family="Arial,sans-serif">0.5 → 1.0 — no source-grounding question involved</text>

    <rect x="24" y="310" width="796" height="24" rx="4" fill="rgba(203,208,164,0.14)" stroke="#5c6a2e" stroke-width="0.8"/>
    <text x="36" y="326" fill="#2d3142" font-size="9.5" font-family="Consolas,monospace">edge-ukrainian-language-question</text>
    <circle cx="580" cy="322" r="6" fill="none" stroke="#c0525a" stroke-width="2"/>
    <circle cx="650" cy="322" r="6" fill="#5c6a2e"/>
    <text x="675" y="326" fill="#6f7690" font-size="9" font-family="Arial,sans-serif">judge timed out → judge answered — infra, not r2</text>

    
    <rect x="24" y="342" width="796" height="20" rx="4" fill="rgba(76,82,109,0.06)" stroke="#4c526d" stroke-width="1"/>
    <text x="34" y="356" fill="#2d3142" font-size="10" font-weight="bold" font-family="Arial,sans-serif">UNCHANGED — same status both sides (7 cases)</text>

