    <rect x="24" y="260" width="796" height="20" rx="4" fill="rgba(203,208,164,0.35)" stroke="#5c6a2e" stroke-width="1"/>
    <text x="34" y="274" fill="#2d3142" font-size="10" font-weight="bold" font-family="Arial,sans-serif">RECOVERED — unrelated, likely ordinary sampling variance</text>

    <rect x="24" y="284" width="796" height="24" rx="4" fill="rgba(203,208,164,0.14)" stroke="#5c6a2e" stroke-width="0.8"/>
