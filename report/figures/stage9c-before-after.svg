    <text x="675" y="132" fill="#6f7690" font-size="9" font-family="Arial,sans-serif">0.4 → 0.3 — unchanged, slightly worse</text>

    
    <rect x="24" y="152" width="796" height="20" rx="4" fill="rgba(241,132,138,0.20)" stroke="#c0525a" stroke-width="1"/>
    <text x="34" y="166" fill="#2d3142" font-size="10" font-weight="bold" font-family="Arial,sans-serif">REGRESSION — unrelated to the fix's own target</text>

    <rect x="24" y="176" width="796" height="24" rx="4" fill="rgba(241,132,138,0.06)" stroke="#c0525a" stroke-width="0.8"/>
    <text x="36" y="192" fill="#2d3142" font-size="9.5" font-family="Consolas,monospace">core-2026-agent-frameworks</text>
