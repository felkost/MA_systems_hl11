    <line x1="24" y1="512" x2="820" y2="512" stroke="rgba(76,82,109,0.10)" stroke-width="0.8"/>
    <text x="24" y="528" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">LEGEND</text>
