<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 860" role="img" aria-labelledby="s5a-title s5a-desc">
    <title id="s5a-title">Span tree of one real trial trace, supervisor path</title>
    <desc id="s5a-desc">A simplified real trace: the Supervisor's own model calls bracket three sub-agent tool calls -- plan, research, critique -- each expanding into its own agent span with collapsed nested model and tool children; the Critic approved on the first pass so no revision round occurred in this run, and every span is written to both the offline dump and, if enabled, Langfuse Cloud.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <defs>
      <marker id="s5a-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#6f7690"/>
      </marker>
      <marker id="s5a-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f1848a"/>
      </marker>
    </defs>

    
    <rect x="340" y="8" width="760" height="56" rx="6" fill="rgba(244,210,112,0.20)" stroke="#6f7690" stroke-width="1"/>
    <text x="720" y="26" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="0.08em">EVERY SPAN REACHES BOTH PROCESSORS</text>
    <text x="720" y="42" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">offline dump (always) · Langfuse Cloud (if TRACING_ENABLED)</text>
    <text x="720" y="58" fill="#9296a8" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">one TracerProvider, two SpanProcessors — not a fork in the flow</text>

    
    <rect x="60" y="76" width="200" height="36" rx="6" fill="#ffffff" stroke="#4c526d" stroke-width="1"/>
    <text x="160" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">Supervisor</text>

    <rect x="340" y="76" width="200" height="36" rx="6" fill="#ffffff" stroke="#4c526d" stroke-width="1"/>
    <text x="440" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">agent.planner</text>

    <rect x="620" y="76" width="200" height="36" rx="6" fill="#ffffff" stroke="#4c526d" stroke-width="1"/>
    <text x="720" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">agent.researcher</text>

    <rect x="900" y="76" width="200" height="36" rx="6" fill="#ffffff" stroke="#4c526d" stroke-width="1"/>
    <text x="1000" y="99" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">agent.critic</text>

    
    <line x1="60" y1="132" x2="60" y2="760" stroke="#9296a8" stroke-width="1" stroke-dasharray="2,3"/>
    <line x1="54" y1="132" x2="66" y2="132" stroke="#9296a8" stroke-width="1"/>
    <line x1="54" y1="760" x2="66" y2="760" stroke="#9296a8" stroke-width="1"/>
    <text x="76" y="146" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">repl.question — root span (parentless), wraps the whole trace</text>

    
    <line x1="160" y1="122" x2="160" y2="774" stroke="rgba(76,82,109,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="440" y1="122" x2="440" y2="774" stroke="rgba(76,82,109,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="720" y1="122" x2="720" y2="774" stroke="rgba(76,82,109,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="1000" y1="122" x2="1000" y2="774" stroke="rgba(76,82,109,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

    
    <rect x="156" y="152" width="8" height="8" fill="rgba(231,217,208,0.9)" stroke="#4c526d" stroke-width="1"/>
    <text x="176" y="160" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.supervisor · call 1</text>

    
    <line x1="168" y1="186" x2="432" y2="186" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s5a-arrow)"/>
    <rect x="260" y="172" width="60" height="14" rx="2" fill="#ffffff"/>
    <text x="290" y="183" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">tool.plan</text>

    <rect x="436" y="186" width="8" height="140" rx="2" fill="rgba(244,210,112,0.20)" stroke="#6f7690" stroke-width="1"/>
    <text x="460" y="221" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.planner · 3 calls</text>
    <text x="460" y="237" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">tool.knowledge_search · 1</text>
    <text x="460" y="253" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">tool.web_search · 1</text>

    
    <line x1="440" y1="326" x2="172" y2="326" stroke="#6f7690" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s5a-arrow)"/>
    <rect x="230" y="312" width="80" height="14" rx="2" fill="#ffffff"/>
    <text x="270" y="323" fill="#9296a8" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">plan result</text>

    
    <rect x="156" y="352" width="8" height="8" fill="rgba(231,217,208,0.9)" stroke="#4c526d" stroke-width="1"/>
    <text x="176" y="360" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.supervisor · call 2</text>

    
    <line x1="168" y1="386" x2="712" y2="386" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s5a-arrow)"/>
    <rect x="400" y="372" width="88" height="14" rx="2" fill="#ffffff"/>
    <text x="444" y="383" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">tool.research</text>

    <rect x="716" y="386" width="8" height="170" rx="2" fill="rgba(244,210,112,0.20)" stroke="#6f7690" stroke-width="1"/>
    <text x="740" y="421" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.researcher · 4 calls</text>
    <text x="740" y="437" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">tool.knowledge_search · 2</text>
    <text x="740" y="453" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">tool.read_url · 3 (rate-capped,</text>
    <text x="740" y="469" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">all returned ERROR)</text>

    
    <line x1="720" y1="556" x2="172" y2="556" stroke="#6f7690" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s5a-arrow)"/>
    <rect x="380" y="542" width="120" height="14" rx="2" fill="#ffffff"/>
    <text x="440" y="553" fill="#9296a8" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">research result</text>

    
    <rect x="156" y="582" width="8" height="8" fill="rgba(231,217,208,0.9)" stroke="#4c526d" stroke-width="1"/>
    <text x="176" y="590" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.supervisor · call 3</text>

    
    <line x1="168" y1="616" x2="992" y2="616" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s5a-arrow)"/>
    <rect x="530" y="602" width="90" height="14" rx="2" fill="#ffffff"/>
    <text x="575" y="613" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">tool.critique</text>

    <rect x="996" y="616" width="8" height="80" rx="2" fill="rgba(244,210,112,0.20)" stroke="#6f7690" stroke-width="1"/>
    <text x="1020" y="641" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.critic · 2 calls</text>
    <text x="1020" y="657" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">tool.knowledge_search · 1</text>

    
    <line x1="1000" y1="696" x2="172" y2="696" stroke="#f1848a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#s5a-arrow-accent)"/>
    <rect x="530" y="682" width="88" height="14" rx="2" fill="#ffffff"/>
    <text x="574" y="693" fill="#f1848a" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">APPROVE</text>

    
    <rect x="156" y="716" width="8" height="8" fill="rgba(231,217,208,0.9)" stroke="#4c526d" stroke-width="1"/>
    <text x="176" y="724" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.supervisor · calls 4-5 (compose report)</text>

    <text x="176" y="748" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">no revision round in this real run — Critic approved on the first pass</text>

    
    <line x1="30" y1="792" x2="1150" y2="792" stroke="rgba(76,82,109,0.10)" stroke-width="0.8"/>
    <text x="30" y="806" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="800" x2="160" y2="800" stroke="#6f7690" stroke-width="1.2"/>
    <text x="168" y="804" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">call</text>
    <line x1="230" y1="800" x2="250" y2="800" stroke="#6f7690" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="258" y="804" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">return</text>
    <line x1="330" y1="800" x2="350" y2="800" stroke="#f1848a" stroke-width="1.4"/>
    <text x="358" y="804" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">headline verdict</text>
    <rect x="470" y="794" width="8" height="12" fill="rgba(244,210,112,0.20)" stroke="#6f7690" stroke-width="1"/>
    <text x="484" y="804" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">agent activation (collapsed children)</text>
    <rect x="720" y="794" width="8" height="8" fill="rgba(231,217,208,0.9)" stroke="#4c526d" stroke-width="1"/>
    <text x="734" y="804" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">model.supervisor call (self, no cross-lifeline arrow)</text>
  </svg>
