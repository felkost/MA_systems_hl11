<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="s7a-title s7a-desc">
    <title id="s7a-title">Selection diagram: ancestor-scoped retrieval_context extraction</title>
    <desc id="s7a-desc">Four real tool.knowledge_search spans from one trace, each carrying three retrieval.chunks strings, pass through retrieval_context_for_agent's ancestor walk; only the two spans whose ancestor chain contains agent.researcher are selected into that agent's retrieval_context, while the Planner's and the Critic's own knowledge_search spans are excluded even though a flat name filter would have included them.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <defs>
      <marker id="s7a-arrow-in" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#cbd0a4"/>
      </marker>
      <marker id="s7a-arrow-out" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#f1848a"/>
      </marker>
    </defs>

    <text x="30" y="34" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">FOUR REAL tool.knowledge_search SPANS, ONE TRACE</text>

    
    <rect x="30" y="56" width="290" height="86" rx="6" fill="rgba(76,82,109,0.03)" stroke="#4c526d" stroke-width="1"/>
    <text x="46" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">6f6563ee · knowledge_search</text>
    <text x="46" y="96" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ancestors: agent.planner ← tool.plan</text>
    <text x="46" y="112" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">← repl.question</text>
    <text x="46" y="130" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">retrieval.chunks: 3 strings</text>

    
    <rect x="30" y="156" width="290" height="86" rx="6" fill="rgba(203,208,164,0.20)" stroke="#4c526d" stroke-width="1"/>
    <text x="46" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">32525e5d · knowledge_search</text>
    <text x="46" y="196" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ancestors: agent.researcher ← tool.research</text>
    <text x="46" y="212" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">← repl.question</text>
    <text x="46" y="230" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">retrieval.chunks: 3 strings</text>

    
    <rect x="30" y="256" width="290" height="86" rx="6" fill="rgba(203,208,164,0.20)" stroke="#4c526d" stroke-width="1"/>
    <text x="46" y="278" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">6df40fa1 · knowledge_search</text>
    <text x="46" y="296" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ancestors: agent.researcher ← tool.research</text>
    <text x="46" y="312" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">← repl.question</text>
    <text x="46" y="330" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">retrieval.chunks: 3 strings</text>

    
    <rect x="30" y="356" width="290" height="86" rx="6" fill="rgba(76,82,109,0.03)" stroke="#4c526d" stroke-width="1"/>
    <text x="46" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">ec09ad84 · knowledge_search</text>
    <text x="46" y="396" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ancestors: agent.critic ← tool.critique</text>
    <text x="46" y="412" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">← repl.question</text>
    <text x="46" y="430" fill="#9296a8" font-size="11" font-family="Arial,sans-serif">retrieval.chunks: 3 strings</text>

    
    <rect x="420" y="200" width="260" height="120" rx="8" fill="rgba(244,210,112,0.14)" stroke="#6f7690" stroke-width="1.2"/>
    <text x="550" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">retrieval_context_for_agent(</text>
    <text x="550" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif" text-anchor="middle">run, "agent.researcher")</text>
    <text x="550" y="272" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">walks each span's</text>
    <text x="550" y="288" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">parent_span_id chain,</text>
    <text x="550" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" text-anchor="middle">keeps only a name match</text>

    
    <line x1="320" y1="199" x2="418" y2="240" stroke="#cbd0a4" stroke-width="1.6" marker-end="url(#s7a-arrow-in)"/>
    <line x1="320" y1="299" x2="418" y2="280" stroke="#cbd0a4" stroke-width="1.6" marker-end="url(#s7a-arrow-in)"/>

    
    <line x1="320" y1="99" x2="392" y2="152" stroke="#f1848a" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="320" y1="399" x2="392" y2="348" stroke="#f1848a" stroke-width="1.2" stroke-dasharray="4,3"/>
    <line x1="382" y1="140" x2="406" y2="164" stroke="#f1848a" stroke-width="2"/>
    <line x1="406" y1="140" x2="382" y2="164" stroke="#f1848a" stroke-width="2"/>
    <line x1="382" y1="336" x2="406" y2="360" stroke="#f1848a" stroke-width="2"/>
    <line x1="406" y1="336" x2="382" y2="360" stroke="#f1848a" stroke-width="2"/>
    <text x="394" y="184" fill="#c0525a" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">excluded</text>
    <text x="394" y="326" fill="#c0525a" font-size="10" font-family="Arial,sans-serif" text-anchor="middle">excluded</text>

    
    <rect x="760" y="220" width="390" height="80" rx="6" fill="rgba(203,208,164,0.20)" stroke="#4c526d" stroke-width="1.2"/>
    <text x="780" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">retrieval_context = [6 chunk strings]</text>
    <text x="780" y="262" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">3 from 32525e5d + 3 from 6df40fa1,</text>
    <text x="780" y="278" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">deduplicated, order preserved —</text>
    <text x="780" y="294" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">never the Planner's or Critic's own 3+3</text>

    <line x1="680" y1="260" x2="758" y2="260" stroke="#6f7690" stroke-width="1.4" marker-end="url(#s7a-arrow-in)"/>

    
    <line x1="550" y1="320" x2="550" y2="356" stroke="#6f7690" stroke-width="1.2" marker-end="url(#s7a-arrow-in)"/>
    <rect x="420" y="360" width="730" height="86" rx="6" fill="rgba(241,132,138,0.08)" stroke="#f1848a" stroke-width="1"/>
    <text x="440" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="Arial,sans-serif">Without the ancestor walk (a flat name filter):</text>
    <text x="440" y="400" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">all 4 spans' 12 chunks would enter Groundedness's retrieval_context —</text>
    <text x="440" y="416" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">including chunks the Researcher itself never saw, silently inflating or</text>
    <text x="440" y="432" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">deflating the score against context that is not this agent's own.</text>

    
    <line x1="30" y1="480" x2="1150" y2="480" stroke="rgba(76,82,109,0.10)" stroke-width="0.8"/>
    <text x="30" y="494" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">LEGEND</text>
    <line x1="140" y1="488" x2="160" y2="488" stroke="#cbd0a4" stroke-width="1.6"/>
    <text x="168" y="492" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ancestor match — included</text>
    <line x1="380" y1="488" x2="400" y2="488" stroke="#f1848a" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="408" y="492" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">no ancestor match — stops short, never enters</text>
    <rect x="650" y="482" width="10" height="10" rx="2" fill="rgba(203,208,164,0.20)" stroke="#4c526d" stroke-width="1"/>
    <text x="666" y="491" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">under agent.researcher</text>
    <rect x="850" y="482" width="10" height="10" rx="2" fill="rgba(76,82,109,0.03)" stroke="#4c526d" stroke-width="1"/>
    <text x="866" y="491" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">under a different agent</text>
  </svg>
