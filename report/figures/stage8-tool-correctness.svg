<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" role="img" aria-labelledby="s8a-title s8a-desc">
    <title id="s8a-title">Three tool-correctness configurations over one real eight-call Supervisor run</title>
    <desc id="s8a-desc">A real Supervisor run's eight tool calls form a shared column header: plan, research, critique REVISE, research, critique REVISE, save_report refused, critique APPROVE, save_report saved. Three rows below apply different ToolCorrectnessMetric settings to that same sequence. The shipped setting, an ordered subsequence of critique then save_report, matches calls seven and eight and scores 1.0. An exact-match setting rejects all eight calls and scores 0.0, wrongly failing a healthy run. A save_report-only setting with ordering off is satisfied by call six, the refused save, and scores 1.0, wrongly passing.</desc>
    <rect width="100%" height="100%" fill="#ffffff"/>

    <text x="30" y="26" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">WHAT THE RUN DID — EIGHT TOOL CALLS, IN ORDER</text>

    <g font-family="Arial,sans-serif" text-anchor="middle">
      <rect x="300" y="42" width="96" height="60" rx="6" fill="rgba(76,82,109,0.04)" stroke="#4c526d" stroke-width="1"/>
      <text x="348" y="60" fill="#9296a8" font-size="9">1</text>
      <text x="348" y="78" fill="#2d3142" font-size="11" font-weight="600">plan</text>

      <rect x="406" y="42" width="96" height="60" rx="6" fill="rgba(76,82,109,0.04)" stroke="#4c526d" stroke-width="1"/>
      <text x="454" y="60" fill="#9296a8" font-size="9">2</text>
      <text x="454" y="78" fill="#2d3142" font-size="11" font-weight="600">research</text>

      <rect x="512" y="42" width="96" height="60" rx="6" fill="rgba(241,132,138,0.10)" stroke="#4c526d" stroke-width="1"/>
      <text x="560" y="60" fill="#9296a8" font-size="9">3</text>
      <text x="560" y="78" fill="#2d3142" font-size="11" font-weight="600">critique</text>
      <text x="560" y="93" fill="#c0525a" font-size="9">REVISE</text>

      <rect x="618" y="42" width="96" height="60" rx="6" fill="rgba(76,82,109,0.04)" stroke="#4c526d" stroke-width="1"/>
      <text x="666" y="60" fill="#9296a8" font-size="9">4</text>
      <text x="666" y="78" fill="#2d3142" font-size="11" font-weight="600">research</text>

      <rect x="724" y="42" width="96" height="60" rx="6" fill="rgba(241,132,138,0.10)" stroke="#4c526d" stroke-width="1"/>
      <text x="772" y="60" fill="#9296a8" font-size="9">5</text>
      <text x="772" y="78" fill="#2d3142" font-size="11" font-weight="600">critique</text>
      <text x="772" y="93" fill="#c0525a" font-size="9">REVISE</text>

      <rect x="830" y="42" width="96" height="60" rx="6" fill="rgba(241,132,138,0.20)" stroke="#f1848a" stroke-width="1.4"/>
      <text x="878" y="60" fill="#9296a8" font-size="9">6</text>
      <text x="878" y="78" fill="#2d3142" font-size="11" font-weight="600">save_report</text>
      <text x="878" y="93" fill="#c0525a" font-size="9">REFUSED</text>

      <rect x="936" y="42" width="96" height="60" rx="6" fill="rgba(203,208,164,0.30)" stroke="#4c526d" stroke-width="1.4"/>
      <text x="984" y="60" fill="#9296a8" font-size="9">7</text>
      <text x="984" y="78" fill="#2d3142" font-size="11" font-weight="bold">critique</text>
      <text x="984" y="93" fill="#5c6a2e" font-size="9">APPROVE</text>

      <rect x="1042" y="42" width="96" height="60" rx="6" fill="rgba(203,208,164,0.30)" stroke="#4c526d" stroke-width="1.4"/>
      <text x="1090" y="60" fill="#9296a8" font-size="9">8</text>
      <text x="1090" y="78" fill="#2d3142" font-size="11" font-weight="bold">save_report</text>
      <text x="1090" y="93" fill="#5c6a2e" font-size="9">SAVED</text>
    </g>

    
    <g stroke="rgba(76,82,109,0.38)" stroke-width="1.1" stroke-dasharray="4,4">
      <line x1="348" y1="104" x2="348" y2="127"/><line x1="348" y1="153" x2="348" y2="173"/><line x1="348" y1="199" x2="348" y2="219"/><line x1="348" y1="245" x2="348" y2="258"/>
      <line x1="454" y1="104" x2="454" y2="127"/><line x1="454" y1="153" x2="454" y2="173"/><line x1="454" y1="199" x2="454" y2="219"/><line x1="454" y1="245" x2="454" y2="258"/>
      <line x1="560" y1="104" x2="560" y2="127"/><line x1="560" y1="153" x2="560" y2="173"/><line x1="560" y1="199" x2="560" y2="219"/><line x1="560" y1="245" x2="560" y2="258"/>
      <line x1="666" y1="104" x2="666" y2="127"/><line x1="666" y1="153" x2="666" y2="173"/><line x1="666" y1="199" x2="666" y2="219"/><line x1="666" y1="245" x2="666" y2="258"/>
      <line x1="772" y1="104" x2="772" y2="127"/><line x1="772" y1="153" x2="772" y2="173"/><line x1="772" y1="199" x2="772" y2="219"/><line x1="772" y1="245" x2="772" y2="258"/>
      <line x1="878" y1="104" x2="878" y2="127"/><line x1="878" y1="153" x2="878" y2="173"/><line x1="878" y1="199" x2="878" y2="219"/><line x1="878" y1="245" x2="878" y2="258"/>
      <line x1="984" y1="104" x2="984" y2="127"/><line x1="984" y1="153" x2="984" y2="173"/><line x1="984" y1="199" x2="984" y2="219"/><line x1="984" y1="245" x2="984" y2="258"/>
      <line x1="1090" y1="104" x2="1090" y2="127"/><line x1="1090" y1="153" x2="1090" y2="173"/><line x1="1090" y1="199" x2="1090" y2="219"/><line x1="1090" y1="245" x2="1090" y2="258"/>
    </g>

    
    <rect x="24" y="118" width="1132" height="46" rx="5" fill="rgba(203,208,164,0.14)" stroke="#5c6a2e" stroke-width="1.2"/>
    <text x="38" y="136" fill="#2d3142" font-size="10.5" font-weight="600" font-family="Arial,sans-serif">ordering on · expects [critique, save_report]</text>
    <text x="38" y="152" fill="#5c6a2e" font-size="10.5" font-weight="bold" font-family="Arial,sans-serif">1.0 — correct</text>
    <line x1="984" y1="140" x2="1090" y2="140" stroke="#5c6a2e" stroke-width="1.4"/>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <circle cx="348" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="454" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="560" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="666" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="772" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="878" cy="140" r="2.5" fill="#b9bdc9"/>
      <circle cx="984" cy="140" r="7" fill="#5c6a2e"/>
      <circle cx="1090" cy="140" r="7" fill="#5c6a2e"/>
    </g>

    
    <rect x="24" y="164" width="1132" height="46" rx="5" fill="rgba(241,132,138,0.07)" stroke="#f1848a" stroke-width="1.1"/>
    <text x="38" y="182" fill="#2d3142" font-size="10.5" font-weight="600" font-family="Arial,sans-serif">exact match · expects [critique, save_report]</text>
    <text x="38" y="198" fill="#c0525a" font-size="10.5" font-weight="bold" font-family="Arial,sans-serif">0.0 — wrongly fails</text>
    <g stroke="#f1848a" stroke-width="1.8">
      <line x1="342" y1="180" x2="354" y2="192"/><line x1="354" y1="180" x2="342" y2="192"/>
      <line x1="448" y1="180" x2="460" y2="192"/><line x1="460" y1="180" x2="448" y2="192"/>
      <line x1="554" y1="180" x2="566" y2="192"/><line x1="566" y1="180" x2="554" y2="192"/>
      <line x1="660" y1="180" x2="672" y2="192"/><line x1="672" y1="180" x2="660" y2="192"/>
      <line x1="766" y1="180" x2="778" y2="192"/><line x1="778" y1="180" x2="766" y2="192"/>
      <line x1="872" y1="180" x2="884" y2="192"/><line x1="884" y1="180" x2="872" y2="192"/>
      <line x1="978" y1="180" x2="990" y2="192"/><line x1="990" y1="180" x2="978" y2="192"/>
      <line x1="1084" y1="180" x2="1096" y2="192"/><line x1="1096" y1="180" x2="1084" y2="192"/>
    </g>

    
    <rect x="24" y="210" width="1132" height="46" rx="5" fill="rgba(241,132,138,0.07)" stroke="#f1848a" stroke-width="1.1"/>
    <text x="38" y="228" fill="#2d3142" font-size="10.5" font-weight="600" font-family="Arial,sans-serif">ordering off · expects [save_report]</text>
    <text x="38" y="244" fill="#c0525a" font-size="10.5" font-weight="bold" font-family="Arial,sans-serif">1.0 — wrongly passes</text>
    <g font-family="Arial,sans-serif" text-anchor="middle">
      <circle cx="348" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="454" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="560" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="666" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="772" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="878" cy="232" r="7" fill="#c0525a"/>
      <circle cx="984" cy="232" r="2.5" fill="#b9bdc9"/>
      <circle cx="1090" cy="232" r="2.5" fill="#b9bdc9"/>
    </g>

    <line x1="24" y1="286" x2="1156" y2="286" stroke="rgba(76,82,109,0.10)" stroke-width="0.8"/>
    <text x="24" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif" letter-spacing="0.14em">LEGEND</text>
    <circle cx="126" cy="300" r="7" fill="#5c6a2e"/>
    <text x="140" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">matched</text>
    <circle cx="238" cy="300" r="2.5" fill="#b9bdc9"/>
    <text x="250" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">ignored</text>
    <g stroke="#f1848a" stroke-width="1.8"><line x1="332" y1="294" x2="344" y2="306"/><line x1="344" y1="294" x2="332" y2="306"/></g>
    <text x="356" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">causes the failure</text>
    <circle cx="500" cy="300" r="7" fill="#c0525a"/>
    <text x="514" y="304" fill="#6f7690" font-size="11" font-family="Arial,sans-serif">matched — but on the wrong call</text>
  </svg>
